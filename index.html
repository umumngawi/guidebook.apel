<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide Book — Sekretariat Daerah Kab. Ngawi</title>
<style>
  :root {
    --navy:   #2C3E6B;
    --blue:   #3A6BAC;
    --steel:  #6B8DB5;
    --silver: #B8C8D8;
    --fog:    #D8E2EC;
    --bg:     #E0E8F0;
    --white:  #F4F7FA;
    --shadow: rgba(44,62,107,0.28);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    width: 100%;
    background: var(--navy);
    padding: 13px 28px;
    display: flex;
    align-items: center;
    gap: 13px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  .header-arrow {
    width: 34px; height: 24px;
    background: var(--blue);
    clip-path: polygon(0 0, 78% 0, 100% 50%, 78% 100%, 0 100%);
    flex-shrink: 0;
  }
  header h1 { color: var(--white); font-size: 0.92rem; font-weight: 600; line-height: 1.3; }
  header span { color: var(--silver); font-size: 0.73rem; font-weight: 400; display: block; margin-top: 1px; }

  /* ── Upload zone ── */
  #upload-zone {
    margin-top: 64px;
    width: 320px;
    border: 2px dashed var(--steel);
    border-radius: 10px;
    padding: 48px 28px;
    text-align: center;
    cursor: pointer;
    background: var(--white);
    transition: border-color 0.2s, background 0.2s;
  }
  #upload-zone:hover { border-color: var(--blue); background: var(--fog); }
  #upload-zone svg { color: var(--steel); margin-bottom: 14px; }
  #upload-zone p { color: var(--navy); font-size: 0.92rem; line-height: 1.6; }
  #upload-zone small { color: var(--steel); font-size: 0.78rem; }
  #file-input { display: none; }

  /* ── Loading ── */
  #loading {
    display: none; align-items: center; gap: 12px;
    color: var(--navy); font-size: 0.9rem; margin-top: 60px;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 3px solid var(--fog);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Viewer ── */
  #viewer {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 28px 16px 48px;
  }

  /* ── Book stage: perspective container ── */
  #book-stage {
    perspective: 1800px;
    perspective-origin: 50% 50%;
  }

  /* ── Single page container ── */
  #book {
    position: relative;
    /* size set by JS after PDF loads */
    width: 420px;
    height: 594px;
  }

  /* The two "sides" of the current state */
  .page-slot {
    position: absolute; inset: 0;
    background: var(--white);
    border-radius: 3px;
    overflow: hidden;
    box-shadow:
      4px 4px 18px var(--shadow),
      -1px 0 6px rgba(44,62,107,0.08);
  }
  /* subtle left-edge binding shadow */
  .page-slot::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 18px; height: 100%;
    background: linear-gradient(to right, rgba(44,62,107,0.1), transparent);
    pointer-events: none; z-index: 1;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* ── Flip leaf ── */
  #flip-leaf {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    pointer-events: none;
    z-index: 10;
    display: none;
  }
  .leaf-side {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    background: var(--white);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 4px 4px 18px var(--shadow);
  }
  .leaf-side::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 18px; height: 100%;
    background: linear-gradient(to right, rgba(44,62,107,0.1), transparent);
    pointer-events: none; z-index: 1;
  }
  #leaf-back { transform: rotateY(180deg); }

  @keyframes flipFwd {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(-180deg); }
  }
  @keyframes flipBwd {
    0%   { transform: rotateY(-180deg); }
    100% { transform: rotateY(0deg); }
  }
  #flip-leaf.go-fwd { animation: flipFwd 0.62s cubic-bezier(0.4,0,0.2,1) forwards; }
  #flip-leaf.go-bwd { animation: flipBwd 0.62s cubic-bezier(0.4,0,0.2,1) forwards; }

  /* ── Controls ── */
  #controls {
    margin-top: 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .btn {
    background: var(--navy);
    color: var(--white);
    border: none; border-radius: 6px;
    padding: 9px 20px;
    font-size: 0.86rem; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: background 0.18s, transform 0.1s;
    user-select: none;
  }
  .btn:hover:not(:disabled) { background: var(--blue); }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { background: var(--silver); cursor: default; }

  #page-info {
    color: var(--navy); font-size: 0.85rem;
    min-width: 110px; text-align: center; font-weight: 500;
  }

  /* ── Deco lines ── */
  .deco {
    position: fixed; bottom: 0; left: 0;
    width: 140px; height: 200px;
    pointer-events: none; opacity: 0.1; z-index: 0;
  }

  @media (max-width: 500px) {
    #book { width: 88vw !important; height: calc(88vw * 1.414) !important; }
  }
</style>
</head>
<body>

<svg class="deco" viewBox="0 0 140 200" fill="none">
  <line x1="20" y1="200" x2="110" y2="40" stroke="#2C3E6B" stroke-width="2"/>
  <line x1="45" y1="200" x2="135" y2="40" stroke="#3A6BAC" stroke-width="1.5"/>
  <line x1="0"  y1="200" x2="85"  y2="40" stroke="#6B8DB5" stroke-width="1"/>
</svg>

<header>
  <div class="header-arrow"></div>
  <h1>Guide Book Dokumentasi
    <span>Bagian Umum — Sekretariat Daerah Kab. Ngawi</span>
  </h1>
</header>

<div id="upload-zone" onclick="document.getElementById('file-input').click()">
  <svg width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
    <path d="M12 16V4m0 0L8 8m4-4 4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
  </svg>
  <p>Klik untuk memilih file PDF</p>
  <small>guidebook.pdf atau file PDF lainnya</small>
</div>
<input type="file" id="file-input" accept="application/pdf">

<div id="loading"><div class="spinner"></div><span>Memuat dokumen…</span></div>

<div id="viewer">
  <div id="book-stage">
    <div id="book">
      <!-- current page shown -->
      <div class="page-slot" id="page-slot" data-page="1">
        <canvas id="canvas-main"></canvas>
      </div>
      <!-- flip leaf -->
      <div id="flip-leaf">
        <div class="leaf-side" id="leaf-front"><canvas id="canvas-lf"></canvas></div>
        <div class="leaf-side" id="leaf-back"><canvas id="canvas-lb"></canvas></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" id="btn-prev" disabled>
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      Sebelumnya
    </button>
    <span id="page-info">1 / 1</span>
    <button class="btn" id="btn-next" disabled>
      Selanjutnya
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null, totalPages = 0, currentPage = 1, busy = false;

const uploadZone = document.getElementById('upload-zone');
const fileInput  = document.getElementById('file-input');
const viewerEl   = document.getElementById('viewer');
const loadingEl  = document.getElementById('loading');
const btnPrev    = document.getElementById('btn-prev');
const btnNext    = document.getElementById('btn-next');
const pageInfo   = document.getElementById('page-info');
const flipLeaf   = document.getElementById('flip-leaf');
const bookEl     = document.getElementById('book');
const pageSlot   = document.getElementById('page-slot');

// ── render satu halaman ke canvas tertentu ──
async function renderPage(num, canvas) {
  if (num < 1 || num > totalPages) { return; }
  const page = await pdfDoc.getPage(num);
  const vp0  = page.getViewport({ scale: 1 });
  // Render di resolusi penuh PDF (scale=1), lalu CSS yang mengecilkan
  const scale = window.devicePixelRatio || 1;
  const vp = page.getViewport({ scale });
  canvas.width  = vp.width;
  canvas.height = vp.height;
  // Paksa canvas tampil sesuai container via CSS, bukan lewat atribut width/height
  canvas.style.width  = '100%';
  canvas.style.height = '100%';
  canvas.style.objectFit = 'contain';
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
}

// ── resize book container to match PDF aspect ratio ──
async function fitBookToPage() {
  const page = await pdfDoc.getPage(1);
  const vp   = page.getViewport({ scale: 1 });
  const maxH = Math.min(window.innerHeight - 200, 620);
  const h    = maxH;
  const w    = Math.round(h * (vp.width / vp.height));
  bookEl.style.width  = w + 'px';
  bookEl.style.height = h + 'px';
}

// ── update UI ──
function updateUI() {
  pageInfo.textContent = `${currentPage} / ${totalPages}`;
  pageSlot.dataset.page = currentPage;
  btnPrev.disabled = currentPage <= 1;
  btnNext.disabled = currentPage >= totalPages;
}

// ── flip ke halaman berikutnya ──
async function flipForward() {
  if (busy || currentPage >= totalPages) return;
  busy = true;

  const lfCanvas = document.getElementById('canvas-lf');
  const lbCanvas = document.getElementById('canvas-lb');
  const mainCanvas = document.getElementById('canvas-main');

  // front = halaman sekarang, back = halaman berikutnya
  await renderPage(currentPage,     lfCanvas);
  await renderPage(currentPage + 1, lbCanvas);

  flipLeaf.style.display = 'block';
  flipLeaf.style.transformOrigin = 'left center'; // flip dari kiri ke kanan
  flipLeaf.style.transform = '';
  flipLeaf.className = '';

  // Mulai animasi
  void flipLeaf.offsetWidth; // force reflow
  flipLeaf.classList.add('go-fwd');

  await sleep(310);
  // Di tengah flip, update halaman di background
  currentPage++;
  await renderPage(currentPage, mainCanvas);
  updateUI();

  await sleep(320);
  flipLeaf.classList.remove('go-fwd');
  flipLeaf.style.display = 'none';
  busy = false;
}

// ── flip ke halaman sebelumnya ──
async function flipBack() {
  if (busy || currentPage <= 1) return;
  busy = true;

  const lfCanvas = document.getElementById('canvas-lf');
  const lbCanvas = document.getElementById('canvas-lb');
  const mainCanvas = document.getElementById('canvas-main');

  // back = halaman sekarang, front = halaman sebelumnya
  await renderPage(currentPage - 1, lfCanvas);
  await renderPage(currentPage,     lbCanvas);

  flipLeaf.style.display = 'block';
  flipLeaf.style.transformOrigin = 'left center';
  flipLeaf.style.transform = 'rotateY(-180deg)';
  flipLeaf.className = '';

  void flipLeaf.offsetWidth;
  flipLeaf.classList.add('go-bwd');

  await sleep(310);
  currentPage--;
  await renderPage(currentPage, mainCanvas);
  updateUI();

  await sleep(320);
  flipLeaf.classList.remove('go-bwd');
  flipLeaf.style.display = 'none';
  busy = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── init PDF ──
async function initPDF(source) {
  uploadZone.style.display = 'none';
  loadingEl.style.display  = 'flex';

  pdfDoc = await pdfjsLib.getDocument(source).promise;
  totalPages  = pdfDoc.numPages;
  currentPage = 1;

  await fitBookToPage();
  loadingEl.style.display = 'none';
  viewerEl.style.display  = 'flex';

  await renderPage(1, document.getElementById('canvas-main'));
  updateUI();

  btnPrev.addEventListener('click', flipBack);
  btnNext.addEventListener('click', flipForward);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') flipForward();
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   flipBack();
  });
}

// upload manual
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) {
    e.target.files[0].arrayBuffer().then(buf => initPDF({ data: buf }));
  }
});
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor = 'var(--blue)'; });
uploadZone.addEventListener('dragleave', () => { uploadZone.style.borderColor = ''; });
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.style.borderColor = '';
  if (e.dataTransfer.files[0])
    e.dataTransfer.files[0].arrayBuffer().then(buf => initPDF({ data: buf }));
});

// auto-load kalau guidebook.pdf ada di folder yang sama (GitHub Pages)
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const res = await fetch('guidebook.pdf', { method: 'HEAD' });
    if (res.ok) {
      const buf = await fetch('guidebook.pdf').then(r => r.arrayBuffer());
      initPDF({ data: buf });
    }
  } catch(_) {}
});
</script>
</body>
</html>
