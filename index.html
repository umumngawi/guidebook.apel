<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide Book — Sekretariat Daerah Kab. Ngawi</title>
<style>
  :root {
    --navy:    #2C3E6B;
    --blue:    #3A6BAC;
    --steel:   #6B8DB5;
    --silver:  #B8C8D8;
    --fog:     #D8E2EC;
    --bg:      #E8EDF3;
    --white:   #F4F7FA;
    --shadow:  rgba(44,62,107,0.22);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    width: 100%;
    background: var(--navy);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }
  .header-arrow {
    width: 36px; height: 26px;
    background: var(--blue);
    clip-path: polygon(0 0, 78% 0, 100% 50%, 78% 100%, 0 100%);
    flex-shrink: 0;
  }
  header h1 {
    color: var(--white);
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.3;
  }
  header span {
    color: var(--silver);
    font-size: 0.75rem;
    font-weight: 400;
    display: block;
    margin-top: 1px;
  }

  /* ── Upload zone ── */
  #upload-zone {
    margin-top: 60px;
    width: 340px;
    border: 2px dashed var(--steel);
    border-radius: 10px;
    padding: 48px 32px;
    text-align: center;
    cursor: pointer;
    background: var(--white);
    transition: border-color 0.2s, background 0.2s;
  }
  #upload-zone:hover { border-color: var(--blue); background: var(--fog); }
  #upload-zone svg { color: var(--steel); margin-bottom: 12px; }
  #upload-zone p { color: var(--navy); font-size: 0.92rem; line-height: 1.6; }
  #upload-zone small { color: var(--steel); font-size: 0.78rem; }
  #file-input { display: none; }

  /* ── Viewer wrapper ── */
  #viewer { display: none; flex-direction: column; align-items: center; width: 100%; padding-bottom: 48px; }

  /* ── Book stage ── */
  #book-stage {
    margin-top: 32px;
    perspective: 2400px;
    display: flex;
    justify-content: center;
  }

  /* ── Book (two-page spread) ── */
  #book {
    display: flex;
    gap: 0;
    position: relative;
  }

  .page-panel {
    width: 380px;
    height: 520px;
    background: var(--white);
    overflow: hidden;
    position: relative;
    box-shadow: 4px 4px 24px var(--shadow);
  }
  .page-panel.left {
    border-radius: 4px 0 0 4px;
    box-shadow: -4px 4px 24px var(--shadow);
  }
  .page-panel.right {
    border-radius: 0 4px 4px 0;
  }

  /* spine line */
  #spine {
    width: 6px;
    background: linear-gradient(to bottom, var(--navy), var(--blue) 40%, var(--steel));
    z-index: 10;
    flex-shrink: 0;
    box-shadow: 0 0 8px rgba(0,0,0,0.25);
  }

  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }

  /* ── Flip overlay (the animating leaf) ── */
  #flip-leaf {
    position: absolute;
    top: 0; left: 0;
    width: 380px; height: 520px;
    transform-origin: left center;
    transform-style: preserve-3d;
    pointer-events: none;
    z-index: 20;
    transition: transform 0.6s cubic-bezier(0.42, 0, 0.58, 1);
  }
  #flip-leaf.flipping-forward { animation: flipForward 0.65s cubic-bezier(0.42,0,0.58,1) forwards; }
  #flip-leaf.flipping-back    { animation: flipBack    0.65s cubic-bezier(0.42,0,0.58,1) forwards; }

  @keyframes flipForward {
    0%   { transform: rotateY(0deg); }
    50%  { transform: rotateY(-90deg); z-index: 25; }
    100% { transform: rotateY(-180deg); }
  }
  @keyframes flipBack {
    0%   { transform: rotateY(-180deg); }
    50%  { transform: rotateY(-90deg); z-index: 25; }
    100% { transform: rotateY(0deg); }
  }

  .leaf-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    background: var(--white);
    overflow: hidden;
  }
  .leaf-back {
    transform: rotateY(180deg);
    background: var(--fog);
  }
  .leaf-face canvas, .leaf-back canvas { width: 100%; height: 100%; }

  /* page curl shadow */
  .page-panel.left::after {
    content: '';
    position: absolute; top: 0; right: 0;
    width: 30px; height: 100%;
    background: linear-gradient(to left, rgba(44,62,107,0.08), transparent);
    pointer-events: none;
  }

  /* ── Controls ── */
  #controls {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .btn {
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: 6px;
    padding: 9px 22px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    transition: background 0.18s, transform 0.1s;
    user-select: none;
  }
  .btn:hover { background: var(--blue); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { background: var(--silver); cursor: default; }

  #page-info {
    color: var(--navy);
    font-size: 0.86rem;
    min-width: 100px;
    text-align: center;
    font-weight: 500;
  }

  /* ── Loading ── */
  #loading {
    display: none;
    color: var(--navy);
    font-size: 0.88rem;
    margin-top: 40px;
    align-items: center;
    gap: 10px;
  }
  .spinner {
    width: 22px; height: 22px;
    border: 3px solid var(--fog);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Decorative lines (from cover) ── */
  .deco-lines {
    position: fixed; bottom: 0; left: 0;
    width: 160px; height: 220px;
    pointer-events: none; opacity: 0.13; z-index: 0;
  }

  @media (max-width: 820px) {
    .page-panel { width: 46vw; height: 63vw; }
    #flip-leaf { width: 46vw; height: 63vw; }
  }
  @media (max-width: 520px) {
    #book { flex-direction: column; gap: 0; }
    .page-panel { width: 88vw; height: 120vw; border-radius: 4px; box-shadow: 0 4px 20px var(--shadow); }
    #spine { width: 88vw; height: 5px; }
    #flip-leaf { width: 88vw; height: 120vw; }
    .page-panel.left::after { display: none; }
  }
</style>
</head>
<body>

<!-- Decorative corner lines from cover -->
<svg class="deco-lines" viewBox="0 0 160 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <line x1="30" y1="220" x2="120" y2="60" stroke="#2C3E6B" stroke-width="2"/>
  <line x1="55" y1="220" x2="145" y2="60" stroke="#3A6BAC" stroke-width="1.5"/>
  <line x1="10" y1="220" x2="95"  y2="60" stroke="#6B8DB5" stroke-width="1"/>
</svg>

<header>
  <div class="header-arrow"></div>
  <h1>Guide Book Dokumentasi
    <span>Sekretariat Daerah Kab. Ngawi</span>
  </h1>
</header>

<!-- Upload -->
<div id="upload-zone" onclick="document.getElementById('file-input').click()">
  <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
    <path d="M12 16V4m0 0L8 8m4-4 4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
  </svg>
  <p>Klik untuk memilih file PDF</p>
  <small>guidebook.pdf atau file PDF lainnya</small>
</div>
<input type="file" id="file-input" accept="application/pdf">

<div id="loading">
  <div class="spinner"></div>
  <span>Memuat dokumen…</span>
</div>

<!-- Viewer -->
<div id="viewer">
  <div id="book-stage">
    <div id="book">
      <!-- Left page -->
      <div class="page-panel left" id="left-panel">
        <canvas id="canvas-left"></canvas>
      </div>

      <!-- Spine -->
      <div id="spine"></div>

      <!-- Right page -->
      <div class="page-panel right" id="right-panel">
        <canvas id="canvas-right"></canvas>
      </div>

      <!-- Flip leaf (animates over right panel) -->
      <div id="flip-leaf" style="left:386px; top:0; position:absolute;">
        <div class="leaf-face" id="leaf-front"><canvas id="canvas-leaf-front"></canvas></div>
        <div class="leaf-face leaf-back" id="leaf-back"><canvas id="canvas-leaf-back"></canvas></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" id="btn-prev" disabled>
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      Sebelumnya
    </button>
    <span id="page-info">Halaman 1 / 1</span>
    <button class="btn" id="btn-next" disabled>
      Selanjutnya
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc     = null;
let totalPages = 0;
// currentSpread: the left-page index (1-based). Left = currentSpread, Right = currentSpread+1
let currentSpread = 1;
let isAnimating   = false;

const uploadZone  = document.getElementById('upload-zone');
const fileInput   = document.getElementById('file-input');
const viewerEl    = document.getElementById('viewer');
const loadingEl   = document.getElementById('loading');
const btnPrev     = document.getElementById('btn-prev');
const btnNext     = document.getElementById('btn-next');
const pageInfo    = document.getElementById('page-info');
const flipLeaf    = document.getElementById('flip-leaf');

/* ── render a page into a canvas ── */
async function renderPage(pageNum, canvas) {
  if (pageNum < 1 || pageNum > totalPages) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }
  const page     = await pdfDoc.getPage(pageNum);
  const panel    = canvas.parentElement;
  const pw       = panel.clientWidth  || 380;
  const ph       = panel.clientHeight || 520;
  const vp0      = page.getViewport({ scale: 1 });
  const scale    = Math.min(pw / vp0.width, ph / vp0.height);
  const viewport = page.getViewport({ scale });
  canvas.width   = viewport.width;
  canvas.height  = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
}

/* ── update static left/right panels ── */
async function renderSpread(left, right) {
  await Promise.all([
    renderPage(left,  document.getElementById('canvas-left')),
    renderPage(right, document.getElementById('canvas-right')),
  ]);
  updateUI();
}

/* ── UI state ── */
function updateUI() {
  pageInfo.textContent = `Halaman ${currentSpread}–${Math.min(currentSpread+1, totalPages)} / ${totalPages}`;
  btnPrev.disabled = currentSpread <= 1;
  btnNext.disabled = currentSpread + 1 >= totalPages;
}

/* ── flip forward (next spread) ── */
async function flipForward() {
  if (isAnimating || currentSpread + 1 >= totalPages) return;
  isAnimating = true;

  // Leaf front = current right page, leaf back = next left page
  const leafFrontCanvas = document.getElementById('canvas-leaf-front');
  const leafBackCanvas  = document.getElementById('canvas-leaf-back');
  const rightPanel      = document.getElementById('right-panel');

  // Position leaf over right panel
  const book = document.getElementById('book');
  const bookRect = book.getBoundingClientRect();
  const rightRect = rightPanel.getBoundingClientRect();
  flipLeaf.style.left = (rightRect.left - bookRect.left) + 'px';
  flipLeaf.style.top  = (rightRect.top  - bookRect.top)  + 'px';
  flipLeaf.style.width  = rightPanel.offsetWidth  + 'px';
  flipLeaf.style.height = rightPanel.offsetHeight + 'px';
  leafFrontCanvas.style.width  = '100%';
  leafFrontCanvas.style.height = '100%';
  leafBackCanvas.style.width   = '100%';
  leafBackCanvas.style.height  = '100%';

  // Copy current right page onto leaf front
  await renderPage(currentSpread + 1, leafFrontCanvas);
  // Render next pages onto leaf back
  await renderPage(currentSpread + 2, leafBackCanvas);

  flipLeaf.style.display = 'block';
  flipLeaf.style.transform = '';
  flipLeaf.classList.add('flipping-forward');

  await sleep(330);
  // Mid-flip: update background panels to next spread
  currentSpread += 2;
  await renderPage(currentSpread,     document.getElementById('canvas-left'));
  await renderPage(currentSpread + 1, document.getElementById('canvas-right'));

  await sleep(330);
  flipLeaf.classList.remove('flipping-forward');
  flipLeaf.style.display = 'none';
  updateUI();
  isAnimating = false;
}

/* ── flip back (prev spread) ── */
async function flipBack() {
  if (isAnimating || currentSpread <= 1) return;
  isAnimating = true;

  const leafFrontCanvas = document.getElementById('canvas-leaf-front');
  const leafBackCanvas  = document.getElementById('canvas-leaf-back');
  const rightPanel      = document.getElementById('right-panel');

  const book = document.getElementById('book');
  const bookRect  = book.getBoundingClientRect();
  const rightRect = rightPanel.getBoundingClientRect();
  flipLeaf.style.left   = (rightRect.left - bookRect.left) + 'px';
  flipLeaf.style.top    = (rightRect.top  - bookRect.top)  + 'px';
  flipLeaf.style.width  = rightPanel.offsetWidth  + 'px';
  flipLeaf.style.height = rightPanel.offsetHeight + 'px';

  // Leaf is already "flipped" (rotateY -180), front = prev right, back = current left
  await renderPage(currentSpread - 1, leafFrontCanvas);
  await renderPage(currentSpread,     leafBackCanvas);

  flipLeaf.style.display = 'block';
  flipLeaf.style.transform = 'rotateY(-180deg)';
  flipLeaf.classList.add('flipping-back');

  await sleep(330);
  currentSpread -= 2;
  await renderPage(currentSpread,     document.getElementById('canvas-left'));
  await renderPage(currentSpread + 1, document.getElementById('canvas-right'));

  await sleep(330);
  flipLeaf.classList.remove('flipping-back');
  flipLeaf.style.display = 'none';
  updateUI();
  isAnimating = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ── load PDF ── */
async function loadPDF(file) {
  uploadZone.style.display = 'none';
  loadingEl.style.display  = 'flex';

  const arrayBuffer = await file.arrayBuffer();
  pdfDoc     = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  totalPages = pdfDoc.numPages;
  currentSpread = 1;

  loadingEl.style.display = 'none';
  viewerEl.style.display  = 'flex';

  await renderSpread(1, 2);

  btnPrev.addEventListener('click', flipBack);
  btnNext.addEventListener('click', flipForward);

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') flipForward();
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   flipBack();
  });
}

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadPDF(e.target.files[0]);
});
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor = 'var(--blue)'; });
uploadZone.addEventListener('dragleave', () => { uploadZone.style.borderColor = ''; });
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.style.borderColor = '';
  if (e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]);
});

/* ── If guidebook.pdf is in same folder (GitHub Pages) ── */
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const res = await fetch('guidebook.pdf', { method: 'HEAD' });
    if (res.ok) {
      loadingEl.style.display  = 'flex';
      uploadZone.style.display = 'none';
      const data = await fetch('guidebook.pdf').then(r => r.arrayBuffer());
      pdfDoc     = await pdfjsLib.getDocument({ data }).promise;
      totalPages = pdfDoc.numPages;
      loadingEl.style.display = 'none';
      viewerEl.style.display  = 'flex';
      await renderSpread(1, 2);
      btnPrev.addEventListener('click', flipBack);
      btnNext.addEventListener('click', flipForward);
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') flipForward();
        if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   flipBack();
      });
    }
  } catch(_) { /* file not found, keep upload UI */ }
});
</script>
</body>
</html>
